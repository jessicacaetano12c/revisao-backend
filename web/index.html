<!DOCTYPE html>
<html lang="pt-br" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BenStore | Sua Vitrine de Produtos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header>
        <a href="index.html" class="logo">BenStore</a>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produtos/index.html">Produtos</a></li>
                <li><a href="cadastro/index.html">Cadastrar</a></li>
                <li>
                    <button class="theme-toggle" title="Alternar Tema">
                        <i class="fas fa-moon"></i>
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>BenStore</h1>
            <p>Diversidade e qualidade em um só lugar. Encontre tudo o que você precisa.</p>
        </section>

        <section class="cards-container">
            <a href="produtos/index.html" class="card">
                <i class="fas fa-shopping-bag"></i>
                <h2>Ver Produtos</h2>
                <p>Explore nosso catálogo completo com os melhores produtos do mercado.</p>
            </a>
            <a href="cadastro/index.html" class="card">
                <i class="fas fa-plus-circle"></i>
                <h2>Novo Cadastro</h2>
                <p>Adicione novos itens ao estoque de forma rápida e intuitiva.</p>
            </a>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
