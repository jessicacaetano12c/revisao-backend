<!DOCTYPE html>
<html lang="pt-br" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto | BenStore</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header>
        <a href="../index.html" class="logo">BenStore</a>
        <nav>
            <ul>
                <li><a href="../index.html">Início</a></li>
                <li><a href="../produtos/index.html">Produtos</a></li>
                <li><a href="index.html">Cadastrar</a></li>
                <li>
                    <button class="theme-toggle" title="Alternar Tema">
                        <i class="fas fa-moon"></i>
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h1>Cadastrar Novo Produto</h1>
            <p>Preencha os dados abaixo para adicionar um item ao estoque.</p>

            <form id="productForm">
                <div class="input-group">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" name="nome" required placeholder="Ex: Notebook Gamer">
                </div>

                <div class="input-group">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" name="preco" required step="0.01" placeholder="0.00">
                </div>

                <div class="input-group">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" name="categoria" required placeholder="Ex: Eletrônicos">
                </div>

                <div class="input-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" name="descricao" required
                        placeholder="Descreva brevemente o produto..."></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Cadastrar</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            <div id="message" class="message"></div>
        </div>
    </main>

    <script src="../script.js"></script>
    <script src="script.js"></script>
</body>

</html>
